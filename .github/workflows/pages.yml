name: Publish Mobi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve GitHub Pages base path
        shell: bash
        env:
          CUSTOM_BASE: ${{ vars.BOOK_BASE_PATH }}
          CUSTOM_ORIGIN: ${{ vars.BOOK_SITE_ORIGIN }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPOSITORY_NAME/"
          fi
          if [[ -n "$CUSTOM_BASE" ]]; then BASE_PATH="$CUSTOM_BASE"; fi
          SITE_ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ -n "$CUSTOM_ORIGIN" ]]; then SITE_ORIGIN="$CUSTOM_ORIGIN"; fi
          echo "VITE_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=$SITE_ORIGIN" >> "$GITHUB_ENV"
          echo "Base path: $BASE_PATH"
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "No lockfile committed yet; npm install for the first deploy. Commit the generated package-lock.json for reproducibility."
            npm install --no-audit --no-fund --package-lock=false
          fi
      - name: Unit tests
        run: npm test
      - name: Build site and prerender chapter pages
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
